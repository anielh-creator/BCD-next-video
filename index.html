:root{--body:'Benton Sans',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;--side:clamp(16px,6vw,120px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#F4F3EF;font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(20px,4vh,48px) var(--side)}
.stage{width:100%;max-width:min(1600px,calc((100svh - 80px) * 16 / 9))}
.player{position:relative;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:6px}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
/* big play */
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;cursor:pointer;transition:opacity .35s}
.big span{display:flex;align-items:center;gap:14px;padding:14px 22px 14px 16px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:16px;font-weight:500;letter-spacing:.01em;transition:background .25s,border-color .25s}
.big:hover span{background:rgba(255,255,255,.12);border-color:#fff}
.big i{display:flex;width:38px;height:38px;border-radius:50%;background:#fff;color:#000;align-items:center;justify-content:center}
.big small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-left:4px}
.player.playing .big,.player.started .big{opacity:0;pointer-events:none}
.player.ended .big{opacity:1;pointer-events:auto}
/* control bar */
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:28px 18px 14px;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0));transition:opacity .35s;opacity:0;pointer-events:none}
.player.started .bar{opacity:1;pointer-events:auto}
.player.playing.idle .bar{opacity:0;pointer-events:none}
.player.playing.idle{cursor:none}
.cb{flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:none;color:#fff;cursor:pointer;transition:border-color .2s,background .2s}
.cb:hover,.cb:focus-visible{border-color:#fff;background:rgba(255,255,255,.1);outline:none}
.cb svg{width:14px;height:14px}
.time{flex:none;color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.06em;opacity:.85;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.track{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none}
.track::before,.track .buf,.track .fill{content:"";position:absolute;left:0;top:50%;height:2px;margin-top:-1px;border-radius:2px}
.track::before{right:0;background:rgba(255,255,255,.22)}
.track .buf{background:rgba(255,255,255,.35);width:0}
.track .fill{background:#fff;width:0}
.track .knob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;left:0;transform:scale(0);transition:transform .15s}
.track:hover .knob,.track.drag .knob{transform:scale(1)}
.player:fullscreen{border-radius:0}.player:-webkit-full-screen{border-radius:0}
/* caption */
.cap{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,243,239,.6)}
.cap .by{display:flex;align-items:center;gap:18px}
.cap img{height:14px;width:auto;opacity:.85;display:block}
.cap img.wns{height:13px}
@media (max-width:640px){.bar{gap:10px;padding:22px 10px 10px}.time{min-width:0;font-size:11px}.cb{width:30px;height:30px}.big span{font-size:14px;padding:10px 16px 10px 12px}.big i{width:30px;height:30px}.big small{display:none}.cap{font-size:10px}}
@media (orientation:portrait) and (max-width:640px){body{justify-content:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="stage">
  <div class="player" id="pl">
    <video id="v" src="film.mp4" poster="poster.jpg" preload="metadata" playsinline aria-label="BCD Next vision film"></video>
    <button class="big" id="big" aria-label="Play the film"><span><i><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></i><b id="bigT">Play the film</b><small id="dur">1:30</small></span></button>
    <div class="bar" id="bar">
      <button class="cb" id="pp" aria-label="Play"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="ppi" d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></button>
      <span class="time" id="tm">0:00 / 1:30</span>
      <div class="track" id="tr" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="90" aria-valuenow="0"><div class="buf" id="bf"></div><div class="fill" id="fi"></div><div class="knob" id="kn"></div></div>
      <button class="cb" id="mu" aria-label="Mute"><svg viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5h2.5l3.5-3v10L4 9H1.5z" fill="currentColor" stroke="none"/><path id="mw" d="M10 4.5a3.5 3.5 0 0 1 0 5M11.8 2.8a6 6 0 0 1 0 8.4"/><path id="mx" d="M9.5 5l3.5 4M13 5l-3.5 4" style="display:none"/></svg></button>
      <button class="cb" id="fs" aria-label="Full screen"><svg viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5V1.5H5M9 1.5h3.5V5M12.5 9v3.5H9M5 12.5H1.5V9"/></svg></button>
    </div>
  </div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id),v=$('v'),pl=$('pl'),tr=$('tr');
const PLAY='M3 1.5v11l9-5.5z',PAUSE='M3 1.5h2.8v11H3zM8.2 1.5H11v11H8.2z';
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
let idleT=null;
function wake(){pl.classList.remove('idle');clearTimeout(idleT);if(!v.paused)idleT=setTimeout(()=>pl.classList.add('idle'),2200)}
function toggle(){if(v.paused||v.ended){v.play()}else{v.pause()}}
function sync(){const d=v.duration||90,c=v.currentTime||0;$('fi').style.width=(c/d*100)+'%';$('kn').style.left=(c/d*100)+'%';$('tm').textContent=fmt(c)+' / '+fmt(d);tr.setAttribute('aria-valuenow',Math.round(c));
  if(v.buffered.length){$('bf').style.width=(v.buffered.end(v.buffered.length-1)/d*100)+'%'}}
v.addEventListener('loadedmetadata',()=>{$('dur').textContent=fmt(v.duration);tr.setAttribute('aria-valuemax',Math.round(v.duration));sync()});
v.addEventListener('timeupdate',sync);v.addEventListener('progress',sync);
v.addEventListener('play',()=>{pl.classList.add('playing','started');pl.classList.remove('ended');$('ppi').setAttribute('d',PAUSE);$('pp').setAttribute('aria-label','Pause');wake()});
v.addEventListener('pause',()=>{pl.classList.remove('playing','idle');$('ppi').setAttribute('d',PLAY);$('pp').setAttribute('aria-label','Play')});
v.addEventListener('ended',()=>{pl.classList.add('ended');$('bigT').textContent='Watch again';try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}});
$('big').addEventListener('click',()=>{if(v.ended)v.currentTime=0;v.play()});
$('pp').addEventListener('click',toggle);
v.addEventListener('click',toggle);
pl.addEventListener('pointermove',wake);pl.addEventListener('touchstart',wake,{passive:true});
function vol(){const m=v.muted;$('mw').style.display=m?'none':'';$('mx').style.display=m?'':'none';$('mu').setAttribute('aria-label',m?'Unmute':'Mute')}
$('mu').addEventListener('click',()=>{v.muted=!v.muted;vol()});v.addEventListener('volumechange',vol);
$('fs').addEventListener('click',()=>{const d=document;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
  else if(pl.requestFullscreen){pl.requestFullscreen()}else if(pl.webkitRequestFullscreen){pl.webkitRequestFullscreen()}else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen()}});
function seekAt(x){const r=tr.getBoundingClientRect(),p=Math.min(1,Math.max(0,(x-r.left)/r.width));v.currentTime=p*(v.duration||90);sync()}
tr.addEventListener('pointerdown',e=>{tr.setPointerCapture(e.pointerId);tr.classList.add('drag');seekAt(e.clientX)});
tr.addEventListener('pointermove',e=>{if(tr.classList.contains('drag'))seekAt(e.clientX)});
tr.addEventListener('pointerup',()=>tr.classList.remove('drag'));tr.addEventListener('pointercancel',()=>tr.classList.remove('drag'));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;const k=e.key;
  if(k===' '||k==='k'){if(e.target.tagName==='BUTTON'&&k===' ')return;e.preventDefault();toggle()}
  else if(k==='ArrowRight'){v.currentTime=Math.min((v.duration||90),v.currentTime+5);wake()}
  else if(k==='ArrowLeft'){v.currentTime=Math.max(0,v.currentTime-5);wake()}
  else if(k==='m'){v.muted=!v.muted}else if(k==='f'){$('fs').click()}});
})();
</script>
</body>
</html>
